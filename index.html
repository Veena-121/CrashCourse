<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CourseForge — Turn Playlists into Courses</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <!-- ── Sidebar ───────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-text">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Course<span>Forge</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item" data-page="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        My Courses
      </button>
      <button class="nav-item" data-page="new">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        New Course
      </button>
      <button class="nav-item" data-page="badges">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
        Badges
      </button>
    </nav>

    <div class="sidebar-bottom">
      <div class="xp-widget">
        <div class="xp-label">
          <span>XP Progress</span>
          <span id="xp-current">0 XP · Lv 1</span>
        </div>
        <div class="xp-bar-track">
          <div class="xp-bar-fill" id="xp-bar-fill" style="width:0%"></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ── Main ──────────────────────────────────────────── -->
  <main class="main">

    <!-- Topbar -->
    <div class="topbar">
      <span class="topbar-title" id="topbar-title">My Courses</span>
      <div class="topbar-right">
        <div class="streak-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          <span id="streak-count">0 day streak</span>
        </div>
      </div>
    </div>

    <div class="content-area">

      <!-- ── Page: Home ───────────────────────────────── -->
      <div class="page" id="page-home">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
          <h2 style="font-size:22px;font-weight:800">My Courses</h2>
          <button class="btn btn-primary btn-sm" onclick="navigateTo('new')">+ New Course</button>
        </div>
        <div id="course-list"></div>
      </div>

      <!-- ── Page: New course ─────────────────────────── -->
      <div class="page" id="page-new">
        <div class="setup-hero" style="margin:0 auto">
          <h1 style="font-size:2rem;margin-bottom:8px">Build a Course</h1>
          <p style="margin-bottom:28px">Paste a YouTube playlist URL or enter videos manually</p>

          <div class="setup-card">
            <div class="setup-tabs">
              <button class="setup-tab active" data-tab="url">📎 From Playlist URL</button>
              <button class="setup-tab" data-tab="manual">✏️ Manual Entry</button>
            </div>

            <!-- Tab: URL -->
            <div class="tab-content active" id="tab-url">
              <div class="form-group">
                <label>YouTube Playlist URL</label>
                <div class="form-row">
                  <input type="url" id="playlist-url" placeholder="https://www.youtube.com/playlist?list=…">
                  <button class="btn btn-primary" id="btn-fetch-playlist">Fetch</button>
                </div>
              </div>
              <div id="playlist-info"></div>
              <div id="url-build-section" style="display:none">
                <div class="form-group">
                  <label>Course Title</label>
                  <input type="text" id="url-course-title" placeholder="e.g. Python Fundamentals">
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                  <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" id="url-start-date">
                  </div>
                  <div class="form-group">
                    <label>Days per Lesson</label>
                    <input type="number" id="url-days-per-lesson" value="2" min="1" max="14">
                  </div>
                </div>
                <button class="btn btn-primary btn-full" id="btn-build-url">Create Course →</button>
              </div>
            </div>

            <!-- Tab: Manual -->
            <div class="tab-content" id="tab-manual">
              <div class="form-group">
                <label>Course Title</label>
                <input type="text" id="manual-course-title" placeholder="e.g. Design Basics">
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                <div class="form-group">
                  <label>Start Date</label>
                  <input type="date" id="manual-start-date">
                </div>
                <div class="form-group">
                  <label>Days per Lesson</label>
                  <input type="number" id="manual-days-per-lesson" value="2" min="1" max="14">
                </div>
              </div>
              <div class="form-group">
                <label>Videos</label>
                <div id="manual-video-list" class="manual-video-list"></div>
                <button class="btn btn-outline btn-sm" id="btn-add-video">+ Add Video</button>
              </div>
              <button class="btn btn-primary btn-full" id="btn-build-manual" style="margin-top:8px">Create Course →</button>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Page: Course view ─────────────────────────── -->
      <div class="page" id="page-course">
        <div class="stats-row">
          <div class="stat-card"><div class="stat-val" id="stat-lessons">0</div><div class="stat-label">Lessons done</div></div>
          <div class="stat-card"><div class="stat-val" id="stat-quizzes">0</div><div class="stat-label">Quizzes passed</div></div>
          <div class="stat-card"><div class="stat-val" id="stat-xp">0</div><div class="stat-label">Total XP</div></div>
          <div class="stat-card"><div class="stat-val" id="stat-streak">0</div><div class="stat-label">Day streak</div></div>
        </div>

        <div class="course-header">
          <div class="course-meta">
            <h2 id="course-view-title">Course</h2>
            <div class="sub">
              <span id="course-lesson-count">0 lessons</span>
            </div>
          </div>
          <div class="progress-ring-wrap">
            <svg width="90" height="90" viewBox="0 0 90 90">
              <circle cx="45" cy="45" r="40" fill="none" stroke="var(--bg3)" stroke-width="7"/>
              <circle id="ring-circle" cx="45" cy="45" r="40" fill="none"
                stroke="var(--accent)" stroke-width="7"
                stroke-linecap="round"
                stroke-dasharray="0 251.2"
                transform="rotate(-90 45 45)"
                style="transition:stroke-dasharray 0.6s ease"/>
              <text id="ring-pct" x="45" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="var(--text)" font-family="Syne,sans-serif">0%</text>
            </svg>
          </div>
        </div>

        <div class="lessons-grid" id="lessons-list"></div>
      </div>

      <!-- ── Page: Badges ──────────────────────────────── -->
      <div class="page" id="page-badges">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
          <div>
            <h2 style="font-size:22px;font-weight:800">Achievements</h2>
            <p style="color:var(--muted);font-size:13px;margin-top:4px" id="badges-earned-count">0 / 10 earned</p>
          </div>
        </div>
        <div class="badges-grid" id="badges-grid"></div>
      </div>

    </div><!-- /content-area -->
  </main>
</div><!-- /app-shell -->

<!-- ── Lesson modal ─────────────────────────────────────── -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:2px" id="lesson-number-badge">Lesson 1</div>
        <h3 id="modal-lesson-title">Lesson title</h3>
      </div>
      <button class="btn-icon" id="btn-modal-close" style="font-size:20px">✕</button>
    </div>
    <div class="modal-body">
      <div class="video-embed">
        <iframe id="video-frame" src="" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="btn-mark-watched">Mark as Watched</button>
      </div>
      <div id="quiz-area"></div>
    </div>
  </div>
</div>

<!-- ── Badge earned popup ────────────────────────────────── -->
<div class="badge-popup" id="badge-popup">
  <div class="badge-popup-inner">
    <span class="badge-popup-icon" id="popup-badge-icon">🏆</span>
    <h3>Badge Unlocked!</h3>
    <p id="popup-badge-name" style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px"></p>
    <p id="popup-badge-desc"></p>
    <button class="btn btn-primary btn-sm" onclick="document.getElementById('badge-popup').classList.remove('show')">Nice!</button>
  </div>
</div>

<!-- ── Toasts ────────────────────────────────────────────── -->
<div class="toast-container" id="toast-container"></div>

<!-- ── Scripts (order matters) ──────────────────────────── -->
<script src="config.js"></script>
<script src="js/storage.js"></script>
<script src="js/badges.js"></script>
<script src="js/youtube.js"></script>
<script src="js/quiz.js"></script>
<script src="js/app.js"></script>

<script>
  // Set today's date as default for date inputs
  document.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('url-start-date').value = today;
    document.getElementById('manual-start-date').value = today;
  });
</script>

</body>
</html>
